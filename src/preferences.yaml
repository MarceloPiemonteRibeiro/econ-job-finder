deal_breakers:
  - job description states German language is REQUIRED (not merely "preferred" or "a plus")
  - salary explicitly stated below 3000 EUR/month gross

hard_constraints_informational:  # do not auto-filter; flag as caveat
  - no EU citizenship (some EU/ECB career-path roles will exclude)

scoring_hint: |
  Higher = better fit. Combine role tier + field match + location tier + contract length.
  Deal-breakers hard-fail. Informational constraints get a warning, not exclusion.
