# sources.yaml — Marcelo, econ JM 2026-27
# Phase 2 script consumes this. Manual sources are for you to check by hand.
#
# type: rss | html | manual
#   rss:    URL is an RSS/Atom feed → feedparser
#   html:   plain HTML page          → requests + BS4 with `selector`
#   manual: skipped by script         → login-walled, static, or national-language
# selector: CSS selector for job-list items (html only; filled in during Phase 2 inspection)
# credentials: key in credentials.local
# note: free-text
#
# URL ACCURACY: boards/aggregators are verified-common; institutional careers URLs
# (esp. central banks) are best-effort and MUST be verified before Phase 2 relies on
# them — the checker logs 404s. ponytail: fix on 404, don't hand-click 130 links.
#
# For research jobs specifically, most of these institutions ALSO post on EJM/JOE —
# the career pages catch the analyst/non-EJM long tail.

sources:

